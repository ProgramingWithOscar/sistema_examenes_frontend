<div class="d-flex justify-content-center align-items-center min-vh-100">
    <!-- Contenedor principal de dos columnas -->
    <div class="row w-100">
        <!-- Columna 1: Formulario de login -->
        <div class="col-12 col-md-6 d-flex justify-content-center align-items-center">
            <div class="bg-body d-flex flex-column rounded-4 shadow w-100 p-4 p-md-5">
                <div class="text-center mb-4">
                    <h1 class="text-gray-900 fw-bolder mb-3">Registro</h1>
                    <small class="text-gray-400">OTECH EXAMS gestiona tus exámenes de manera eficiente</small>
                </div>

                <form #form="ngForm" (ngSubmit)="formSubmit(form)" class="form w-100 fv-plugins-bootstrap5 fv-plugins-framework"
                    novalidate>
                    <div class="fv-row mb-3">
                        <input [(ngModel)]="user.username" type="text" placeholder="Nombre de usuario" name="username"
                            autocomplete="off" class="form-control bg-transparent border border-1 border-gray-300 p-3">
                        <mat-hint class="text-primary px-2">El nombre de usuario debe ser único</mat-hint>
                    </div>

                    <div class="d-flex gap-2">
                        <div class="fv-row mb-3 col-6">
                            <input [(ngModel)]="user.nombre" type="text" placeholder="Nombre(s)" name="nombre"
                                autocomplete="off"
                                class="form-control bg-transparent border border-1 border-gray-300 p-3">
                        </div>
                        <div class="fv-row mb-3 col-6">
                            <input [(ngModel)]="user.apellido" type="text" placeholder="Apellido(s)" name="apellido"
                                autocomplete="off"
                                class="form-control bg-transparent border border-1 border-gray-300 p-3">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <div class="fv-row mb-3 col-6">
                            <input [(ngModel)]="user.email" type="email" placeholder="Email" name="email"
                                autocomplete="off"
                                class="form-control bg-transparent border border-1 border-gray-300 p-3">
                        </div>
                        <div class="fv-row mb-3 col-6">
                            <input [(ngModel)]="user.telefono" type="text" placeholder="Teléfono" name="telefono"
                                autocomplete="off"
                                class="form-control bg-transparent border border-1 border-gray-300 p-3">
                        </div>
                    </div>

                    <div class="fv-row mb-4">
                        <input [(ngModel)]="user.password" type="password" placeholder="Password" name="password"
                            autocomplete="off" class="form-control bg-transparent border border-1 border-gray-300 p-3">
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary py-3">
                            <span class="indicator-label">Registrarse</span>
                        </button>
                    </div>
                </form>

            </div>
        </div>

        <!-- Columna 2: Imagen -->
        <div class="col-12 col-md-6 d-flex justify-content-center align-items-center">
            <img src="assets/images/agency.png" alt="Imagen" class="img-fluid">
        </div>
    </div>
</div>
