<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="container">
    <div class="row shadow rounded-4 overflow-hidden">
      
      <!-- Imagen lateral -->
      <div class="col-md-6 d-none d-md-flex bg-primary align-items-center justify-content-center">
        <img src="assets/images/agency.png" alt="Imagen ilustrativa" class="img-fluid p-4">
      </div>

      <!-- Formulario de registro -->
      <div class="col-12 col-md-6 bg-white p-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold text-dark mb-2">Registro</h2>
          <p class="text-muted mb-0">Crea tu cuenta y gestiona tus exámenes con IA</p>
        </div>

        <form #form="ngForm" (ngSubmit)="formSubmit(form)" novalidate>

          <div class="mb-3">
            <input required [(ngModel)]="user.username" type="text" name="username"
              placeholder="Nombre de usuario"
              class="form-control form-control-lg border border-secondary-subtle bg-light" />
            <mat-hint class="text-primary small">Debe ser único</mat-hint>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <input [(ngModel)]="user.nombre" type="text" name="nombre"
                placeholder="Nombre(s)"
                class="form-control form-control-lg border border-secondary-subtle bg-light" />
            </div>
            <div class="col-md-6 mb-3">
              <input [(ngModel)]="user.apellido" type="text" name="apellido"
                placeholder="Apellido(s)"
                class="form-control form-control-lg border border-secondary-subtle bg-light" />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <input [(ngModel)]="user.email" type="email" name="email"
                placeholder="Correo electrónico"
                class="form-control form-control-lg border border-secondary-subtle bg-light" />
            </div>
            <div class="col-md-6 mb-3">
              <input [(ngModel)]="user.telefono" type="text" name="telefono"
                placeholder="Teléfono"
                class="form-control form-control-lg border border-secondary-subtle bg-light" />
            </div>
          </div>

          <div class="mb-4">
            <input [(ngModel)]="user.password" type="password" name="password"
              placeholder="Contraseña"
              class="form-control form-control-lg border border-secondary-subtle bg-light" />
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">
              Crear cuenta
            </button>
          </div>

          <div class="text-center mt-3">
            <small class="text-muted">¿Ya tienes una cuenta? <a routerLink="/login" class="text-decoration-none">Inicia sesión</a></small>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
