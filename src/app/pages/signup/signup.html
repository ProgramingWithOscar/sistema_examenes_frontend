<div class="d-flex justify-content-center align-items-center min-vh-100">
    <!-- Contenedor principal de dos columnas -->
    <div class="row w-100">
        <!-- Columna 1: Formulario de login -->
        <div class="col-12 col-md-6 d-flex justify-content-center align-items-center">
            <div class="bg-body d-flex flex-column rounded-4 shadow w-100 p-4 p-md-5">
                <div class="text-center mb-4">
                    <h1 class="text-gray-900 fw-bolder mb-3">Registro</h1>
                    <small class="text-gray-400">OTECH EXAMS gestiona tus exámenes de manera eficiente</small>
                </div>

                <form class="form w-100 fv-plugins-bootstrap5 fv-plugins-framework" novalidate="novalidate"
                    id="kt_sign_in_form" data-kt-redirect-url="index.html" action="#">
                    <div class="fv-row mb-3">
                        <input type="text" placeholder="Nombre de usuario" name="user" autocomplete="off"
                            class="form-control bg-transparent border border-1 border-gray-300 p-3">
                    </div>
                    <div class="d-flex gap-2">
                        <div class="fv-row mb-3 col-6">
                            <input type="text" placeholder="Nombre(s)" name="user" autocomplete="off"
                                class="form-control bg-transparent border border-1 border-gray-300 p-3">
                        </div>
                        <div class="fv-row mb-3 col-6">
                            <input type="text" placeholder="Apellido(s)" name="user" autocomplete="off"
                                class="form-control bg-transparent border border-1 border-gray-300 p-3">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <div class="fv-row mb-3 col-6">
                        <input type="text" placeholder="Email" name="email" autocomplete="off"
                            class="form-control bg-transparent border border-1 border-gray-300 p-3">
                         </div>
                         <div class="fv-row mb-3 col-6">
                            <input type="text" placeholder="Telefono" name="user" autocomplete="off"
                                class="form-control bg-transparent border border-1 border-gray-300 p-3">
                        </div>
                    </div>

                    <div class="fv-row mb-4">
                        <input type="password" placeholder="Password" name="password" autocomplete="off"
                            class="form-control bg-transparent border border-1 border-gray-300 p-3">
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" id="kt_sign_in_submit" class="btn btn-primary py-3">
                            <span class="indicator-label">Registrarse</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Columna 2: Imagen -->
        <div class="col-12 col-md-6 d-flex justify-content-center align-items-center">
            <img src="assets/images/agency.png" alt="Imagen" class="img-fluid">
        </div>
    </div>
</div>
